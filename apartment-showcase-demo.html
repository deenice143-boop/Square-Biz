// ---- Lucide icon shim: build components directly from lucide.icons SVG node data ----
function LucideIcon({ icon, size = 16, color = "currentColor", strokeWidth = 2, className = "", style = {}, fill = "none" }) {
  const node = lucide.icons[icon];
  if (!node) return null;
  const svgEl = lucide.createElement(node);
  svgEl.setAttribute('width', size);
  svgEl.setAttribute('height', size);
  svgEl.setAttribute('stroke', color);
  svgEl.setAttribute('stroke-width', strokeWidth);
  svgEl.setAttribute('fill', fill);
  return React.createElement('span', {
    className,
    style: { display: 'inline-flex', lineHeight: 0, flexShrink: 0, ...style },
    dangerouslySetInnerHTML: { __html: svgEl.outerHTML }
  });
}

const PROPERTY_PHOTO = {

  2: IMG.penthouse,   // Vesper Heights
  3: IMG.studio,      // The Linden House
  4: IMG.twoBedroom,  // Harbor & Vine
};

function PropertyArt({ id, className = "", iconSize = 28 }) {
  const src = PROPERTY_PHOTO[id] || IMG.studio;
  return (
    <div className={`relative overflow-hidden ${className}`}>
      <img src={src} alt="" className="w-full h-full object-cover" />
    </div>
  );
}

function LangProvider({ children }) {
  const [lang, setLang] = useState("en");
  const t = (key) => {
    const entry = STRINGS[key];
    if (!entry) return key;
    return entry[lang] || entry.en;
  };
  return <LangContext.Provider value={{ lang, setLang, t }}>{children}</LangContext.Provider>;
}

// Keyword sets per language so the demo bot understands basic queries in any supported language
const KEYWORDS = {
  pet: ["pet", "dog", "cat", "mascota", "perro", "gato", "animal", "chien", "chat", "haustier", "hund", "katze", "宠物", "狗", "猫"],
  parking: ["park", "estacionamiento", "garaje", "parking", "garage", "停车", "车位"],
  cancel: ["cancel", "cancelar", "annuler", "stornieren", "取消"],
  price: ["price", "cost", "rate", "precio", "costo", "tarifa", "prix", "tarif", "coût", "preis", "kosten", "价格", "费用"],
};

function getReply(input, lang = "en") {
  const t = input.toLowerCase();
  const matches = (key) => KEYWORDS[key].some((kw) => t.includes(kw));
  let entry = CHAT_REPLIES.default;
  if (matches("pet")) entry = CHAT_REPLIES.pet;
  else if (matches("parking")) entry = CHAT_REPLIES.parking;
  else if (matches("cancel")) entry = CHAT_REPLIES.cancel;
  else if (matches("price")) entry = CHAT_REPLIES.price;
  return entry[lang] || entry.en;
}

function useSpeechSupport() {
  const [supported, setSupported] = useState({ stt: false, tts: false });
  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    setSupported({
      stt: !!SR,
      tts: typeof window !== "undefined" && "speechSynthesis" in window,
    });
  }, []);
  return supported;
}

function ChatScreen() {
  const { t, lang } = useLang();
  const [messages, setMessages] = useState(CHAT_SCRIPT[lang] || CHAT_SCRIPT.en);
  const [input, setInput] = useState("");
  const [listening, setListening] = useState(false);     // actively capturing a single utterance
  const [wakeMode, setWakeMode] = useState(false);        // always-on "Hey Vesper" mode
  const [speakReplies, setSpeakReplies] = useState(true); // text-to-speech toggle
  const [speaking, setSpeaking] = useState(false);
  const [micError, setMicError] = useState("");
  const bottomRef = useRef(null);
  const recognitionRef = useRef(null);
  const wakeRecognitionRef = useRef(null);
  const support = useSpeechSupport();

  const SPEECH_LOCALE = { en: "en-US", es: "es-ES", fr: "fr-FR", de: "de-DE", zh: "zh-CN" };

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  // If the conversation is still just the initial greeting, swap it to match a newly selected language
  useEffect(() => {
    setMessages((m) => {
      if (m.length === 1 && m[0].from === "bot") {
        return CHAT_SCRIPT[lang] || CHAT_SCRIPT.en;
      }
      return m;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [lang]);

  const speak = (text) => {
    if (!speakReplies || !support.tts) return;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = SPEECH_LOCALE[lang] || "en-US";
      utter.rate = 1.0;
      utter.pitch = 1.0;
      utter.onstart = () => setSpeaking(true);
      utter.onend = () => setSpeaking(false);
      utter.onerror = () => setSpeaking(false);
      window.speechSynthesis.speak(utter);
    } catch (e) {
      setSpeaking(false);
    }
  };

  const sendText = (text) => {
    if (!text.trim()) return;
    setMessages((m) => [...m, { from: "user", text }]);
    const reply = getReply(text, lang);
    setInput("");
    setTimeout(() => {
      setMessages((m) => [...m, { from: "bot", text: reply }]);
      speak(reply);
    }, 500);
  };

  const send = () => sendText(input);

  // Push-to-talk: single utterance capture
  const startListening = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setMicError(t("micNotSupported"));
      return;
    }
    setMicError("");
    try {
      const rec = new SR();
      rec.lang = SPEECH_LOCALE[lang] || "en-US";
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.onstart = () => setListening(true);
      rec.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        sendText(transcript);
      };
      rec.onerror = (e) => {
        setListening(false);
        if (e.error === "not-allowed" || e.error === "permission-denied") {
          setMicError(t("micDenied"));
        } else if (e.error !== "aborted" && e.error !== "no-speech") {
          setMicError(t("micDenied"));
        }
      };
      rec.onend = () => setListening(false);
      recognitionRef.current = rec;
      rec.start();
    } catch (e) {
      setMicError(t("micNotSupported"));
    }
  };

  const stopListening = () => {
    recognitionRef.current?.stop();
    setListening(false);
  };

  // Wake-word mode: continuous listening for "hey vesper" (wake phrase stays in English across locales, like "Hey Siri")
  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!wakeMode || !SR) return;

    let active = true;
    const rec = new SR();
    rec.lang = SPEECH_LOCALE[lang] || "en-US";
    rec.continuous = true;
    rec.interimResults = true;

    rec.onresult = (e) => {
      const last = e.results[e.results.length - 1];
      const transcript = last[0].transcript.toLowerCase();
      if (transcript.includes("hey vesper") || transcript.includes("hi vesper")) {
        if (last.isFinal) {
          const afterWake = transcript.split(/hey vesper|hi vesper/i).pop().trim();
          if (afterWake) {
            sendText(afterWake);
          } else {
            // Just the wake word alone — open mic for the actual question
            stopWakeListening();
            startListening();
          }
        }
      }
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "permission-denied") {
        setMicError(t("micDenied"));
        setWakeMode(false);
      }
    };
    rec.onend = () => {
      // Auto-restart for continuous wake-word listening, unless turned off
      if (active && wakeMode) {
        try { rec.start(); } catch (e) {}
      }
    };

    wakeRecognitionRef.current = rec;
    try {
      rec.start();
    } catch (e) {
      setMicError(t("micNotSupported"));
      setWakeMode(false);
    }

    return () => {
      active = false;
      rec.onend = null;
      rec.stop();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [wakeMode, lang]);

  const stopWakeListening = () => {
    wakeRecognitionRef.current?.stop();
    setWakeMode(false);
  };

  const toggleWakeMode = () => {
    if (!support.stt) {
      setMicError(t("micNotSupported"));
      return;
    }
    setMicError("");
    setWakeMode((w) => !w);
  };

  const toggleMic = () => {
    if (listening) {
      stopListening();
    } else {
      if (wakeMode) stopWakeListening();
      startListening();
    }
  };

  return (
    <div className="h-full flex flex-col">
      <div className="flex items-center gap-3 px-6 pt-1 pb-3" style={{ borderBottom: `1px solid ${C.border}` }}>
        <div
          className="w-9 h-9 rounded-full flex items-center justify-center"
          style={{ background: C.accentSoft, border: `1px solid ${C.accentBorder}` }}
        >
          <MessageCircle size={15} color={C.accent} />
        </div>
        <div className="flex-1">
          <p className="text-sm font-medium" style={{ color: C.text }}>{t("vesperConcierge")}</p>
          <p className="text-[10px]" style={{ color: speaking ? C.accent : C.accent }}>
            {speaking ? t("speaking") : listening ? t("listening") : wakeMode ? t("listeningForWake") : t("onlineNow")}
          </p>
        </div>
        <button
          onClick={() => setSpeakReplies((s) => !s)}
          className="w-8 h-8 rounded-full flex items-center justify-center"
          style={{ background: C.surface, border: `1px solid ${C.border}` }}
        >
          {speakReplies ? <Volume2 size={13} color={C.accent} /> : <VolumeX size={13} color={C.textFaint} />}
        </button>
      </div>

      {micError && (
        <div className="px-5 pt-2">
          <p className="text-[10px] leading-relaxed" style={{ color: "#C97B63" }}>{micError}</p>
        </div>
      )}

      <div className="flex-1 overflow-y-auto px-5 py-4 flex flex-col gap-3" style={{ scrollbarWidth: "none" }}>
        {messages.map((m, i) => (
          <div key={i} className={`flex ${m.from === "user" ? "justify-end" : "justify-start"}`}>
            <div
              className="max-w-[78%] text-xs leading-relaxed px-3.5 py-2.5"
              style={
                m.from === "user"
                  ? { background: C.accent, color: C.bg, borderRadius: "16px 16px 4px 16px" }
                  : { background: C.surface, color: C.text, opacity: 0.9, border: `1px solid ${C.border}`, borderRadius: "16px 16px 16px 4px" }
              }
            >
              {m.text}
            </div>
          </div>
        ))}
        {listening && (
          <div className="flex justify-end">
            <div
              className="text-xs px-3.5 py-2.5 italic flex items-center gap-2"
              style={{ background: C.accentSoft, color: C.accent, borderRadius: "16px 16px 4px 16px" }}
            >
              <span className="flex gap-0.5">
                <span className="w-1 h-1 rounded-full animate-pulse" style={{ background: C.accent }} />
                <span className="w-1 h-1 rounded-full animate-pulse" style={{ background: C.accent, animationDelay: "0.2s" }} />
                <span className="w-1 h-1 rounded-full animate-pulse" style={{ background: C.accent, animationDelay: "0.4s" }} />
              </span>
              {t("listening")}
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      <div className="px-4 pb-2 flex items-center gap-2">
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && send()}
          placeholder={t("chatPlaceholder")}
          className="flex-1 rounded-full px-4 py-2.5 text-xs outline-none"
          style={{ background: C.surface, border: `1px solid ${C.border}`, color: C.text }}
        />
        <button
          onClick={toggleMic}
          className="w-9 h-9 rounded-full flex items-center justify-center shrink-0"
          style={{
            background: listening ? "#C97B63" : C.surface,
            border: `1px solid ${listening ? "#C97B63" : C.accentBorder}`,
          }}
        >
          {listening ? <MicOff size={14} color={C.text} /> : <Mic size={14} color={C.accent} />}
        </button>
        <button
          onClick={send}
          className="w-9 h-9 rounded-full flex items-center justify-center shrink-0"
          style={{ background: C.accent }}
        >
          <Send size={14} color={C.bg} />
        </button>
      </div>

      <div className="px-4 pb-24 pt-1 flex justify-center">
        <button
          onClick={toggleWakeMode}
          className="text-[10px] px-3 py-1.5 rounded-full flex items-center gap-1.5"
          style={{
            background: wakeMode ? C.accentSoft : "transparent",
            color: wakeMode ? C.accent : C.textFaint,
            border: `1px solid ${wakeMode ? C.accentBorder : C.border}`,
          }}
        >
          <span className="w-1.5 h-1.5 rounded-full" style={{ background: wakeMode ? C.accent : C.textGhost }} />
          {wakeMode ? t("handsFreeOn") : t("handsFreeOff")}
        </button>
      </div>
    </div>
  );
}

  const positions = [
    { top: "28%", left: "32%" },
    { top: "48%", left: "62%" },
    { top: "66%", left: "24%" },
    { top: "20%", left: "68%" },
  ];
  return (
    <div className="h-full relative overflow-hidden">
      <div
        className="absolute inset-0"
        style={{
          background: `radial-gradient(circle at 30% 20%, ${C.green} 0%, ${C.bg} 55%), radial-gradient(circle at 70% 70%, ${C.surface} 0%, ${C.bg} 60%)`,
        }}
      />
      <svg className="absolute inset-0 w-full h-full" style={{ opacity: 0.2 }} preserveAspectRatio="none">
        <line x1="10%" y1="0" x2="30%" y2="100%" stroke={C.text} strokeWidth="1" />
        <line x1="60%" y1="0" x2="40%" y2="100%" stroke={C.text} strokeWidth="1" />
        <line x1="0" y1="40%" x2="100%" y2="55%" stroke={C.text} strokeWidth="1" />
      </svg>

      <div className="relative px-6 pt-1">
        <h1 className="text-xl mb-1" style={{ fontFamily: "'Fraunces', serif", color: C.text }}>
          {t("residencesNearYou")}
        </h1>
        <p className="text-xs mb-4" style={{ color: C.textFaint }}>{LISTINGS.length} {t("availableStays")}</p>
      </div>

      {LISTINGS.map((l, i) => (
        <button
          key={l.id}
          onClick={() => onSelectListing(l)}
          style={{ top: positions[i].top, left: positions[i].left, position: "absolute", transform: "translate(-50%, -50%)" }}
          className="flex flex-col items-center"
        >
          <div
            className="text-[10px] font-medium px-2.5 py-1 rounded-full mb-1 whitespace-nowrap"
            style={{ background: C.accent, color: C.bg, boxShadow: "0 4px 12px rgba(0,0,0,0.4)" }}
          >
            ${l.price}
          </div>
          <div className="w-2.5 h-2.5 rounded-full" style={{ background: C.accent, border: `2px solid ${C.bg}` }} />
        </button>
      ))}
    </div>
  );
}

function BookingsScreen({ favorites }) {
  const { t, lang } = useLang();
  const favListings = LISTINGS.filter((l) => favorites.includes(l.id));
  const firstName = (() => {
    const tr = LISTING_TRANSLATIONS[LISTINGS[0].id];
    return tr ? tr.name[lang] || tr.name.en : LISTINGS[0].name;
  })();
  return (
    <div className="h-full overflow-y-auto px-6 pt-1 pb-24" style={{ scrollbarWidth: "none" }}>
      <h1 className="text-xl mb-1" style={{ fontFamily: "'Fraunces', serif", color: C.text }}>{t("yourStays")}</h1>
      <p className="text-xs mb-6" style={{ color: C.textFaint }}>{t("upcomingDesc")}</p>

      <p className="text-xs uppercase mb-3" style={{ letterSpacing: "0.15em", color: C.accent }}>{t("upcoming")}</p>
      <div
        className="rounded-xl p-4 mb-7 flex items-center gap-3"
        style={{ background: C.surface, border: `1px solid ${C.border}` }}
      >
        <PropertyArt id={LISTINGS[0].id} className="w-14 h-14 rounded-lg" iconSize={18} />
        <div className="flex-1">
          <p className="text-sm" style={{ color: C.text }}>{firstName}</p>
          <p className="text-[11px]" style={{ color: C.textFaint }}>Jul 14 – Jul 18</p>
        </div>
        <span
          className="text-[10px] px-2.5 py-1 rounded-full"
          style={{ background: C.accentSoft, color: C.accent }}
        >
          {t("confirmed")}
        </span>
      </div>

      <p className="text-xs uppercase mb-3" style={{ letterSpacing: "0.15em", color: C.textFaint }}>{t("saved")}</p>
      {favListings.length === 0 ? (
        <p className="text-xs italic" style={{ color: C.textGhost }}>{t("noSaved")}</p>
      ) : (
        <div className="flex flex-col gap-3">
          {favListings.map((l) => {
            const tr = LISTING_TRANSLATIONS[l.id];
            const name = tr ? tr.name[lang] || tr.name.en : l.name;
            const neighborhood = tr ? tr.neighborhood[lang] || tr.neighborhood.en : l.neighborhood;
            return (
              <div key={l.id} className="flex items-center gap-3">
                <PropertyArt id={l.id} className="w-12 h-12 rounded-lg" iconSize={16} />
                <div>
                  <p className="text-xs" style={{ color: C.text }}>{name}</p>
                  <p className="text-[10px]" style={{ color: C.textFaint }}>{neighborhood}</p>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ProfileScreen() {
  const { t, lang, setLang } = useLang();
  const rows = [t("paymentMethods"), t("notifPrefs"), t("helpSupport"), t("legalPrivacy")];
  return (
    <div className="h-full overflow-y-auto px-6 pt-1 pb-24" style={{ scrollbarWidth: "none" }}>
      <div className="flex flex-col items-center pt-4 pb-7">
        <div
          className="w-16 h-16 rounded-full flex items-center justify-center mb-3"
          style={{ background: C.accentSoft, border: `1px solid ${C.accentBorder}` }}
        >
          <User size={24} color={C.accent} />
        </div>
        <p className="text-lg" style={{ fontFamily: "'Fraunces', serif", color: C.text }}>Jordan Avery</p>
        <p className="text-xs" style={{ color: C.textFaint }}>jordan.avery@email.com</p>
      </div>

      <p className="text-xs uppercase mb-2" style={{ letterSpacing: "0.15em", color: C.textFaint }}>{t("language")}</p>
      <div className="grid grid-cols-2 gap-2 mb-6">
        {LANGUAGES.map((l) => {
          const active = lang === l.code;
          return (
            <button
              key={l.code}
              onClick={() => setLang(l.code)}
              className="text-xs px-3 py-2.5 rounded-lg text-left"
              style={{
                background: active ? C.accentSoft : C.surface,
                border: `1px solid ${active ? C.accentBorder : C.border}`,
                color: active ? C.accent : C.textDim,
              }}
            >
              {l.native}
            </button>
          );
        })}
      </div>

      <div className="h-px mb-2" style={{ background: C.border }} />

      <div className="flex flex-col">
        {rows.map((r) => (
          <button
            key={r}
            className="flex items-center justify-between py-4 text-left"
            style={{ borderBottom: `1px solid ${C.border}` }}
          >
            <span className="text-sm" style={{ color: C.text, opacity: 0.8 }}>{r}</span>
            <ChevronRight size={15} color={C.textGhost} />
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------- Root ----------
function AppShell() {
  const { lang, setLang } = useLang();
  const [tab, setTab] = useState("explore");
  const [selectedListing, setSelectedListing] = useState(null);
  const [booking, setBooking] = useState(false);
  const [favorites, setFavorites] = useState([2]);
  const [showChat, setShowChat] = useState(false);
  const [showLangMenu, setShowLangMenu] = useState(false);

  const toggleFavorite = (id) =>
    setFavorites((f) => (f.includes(id) ? f.filter((x) => x !== id) : [...f, id]));

  const handleSelectListing = (l) => {
    setSelectedListing(l);
    setBooking(false);
  };

  const handleBack = () => {
    setSelectedListing(null);
    setBooking(false);
  };

  const handleComplete = () => {
    setSelectedListing(null);
    setBooking(false);
    setTab("explore");
  };

  let content;
  if (selectedListing && booking) {
    content = <BookingFlow listing={selectedListing} onBack={() => setBooking(false)} onComplete={handleComplete} />;
  } else if (selectedListing) {
    content = (
      <ListingDetail
        listing={selectedListing}
        onBack={handleBack}
        onBook={() => setBooking(true)}
        favorites={favorites}
        toggleFavorite={toggleFavorite}
      />
    );
  } else if (tab === "explore") {
    content = (
      <ExploreScreen onSelectListing={handleSelectListing} favorites={favorites} toggleFavorite={toggleFavorite} />
    );
  } else if (tab === "map") {
    content = <MapScreen onSelectListing={handleSelectListing} />;
  } else if (tab === "bookings") {
    content = <BookingsScreen favorites={favorites} />;
  } else {
    content = <ProfileScreen />;
  }

  const currentLangLabel = LANGUAGES.find((l) => l.code === lang)?.native || "English";

  return (
    <div
      className="w-full h-full flex items-center justify-center p-6"
      style={{ background: C.bgOuter, fontFamily: "'Inter', sans-serif" }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
      `}</style>

      <div
        className="relative w-[380px] h-[780px] rounded-[2.75rem] overflow-hidden"
        style={{ background: C.bg, border: `8px solid ${C.bgOuter}`, boxShadow: "0 25px 60px rgba(0,0,0,0.6)" }}
      >
        <div
          className="absolute top-0 left-1/2 w-32 h-6 rounded-b-2xl z-20"
          style={{ background: C.bgOuter, transform: "translateX(-50%)" }}
        />

        <div className="relative w-full h-full flex flex-col">
          <StatusBar />

          {!selectedListing && (
            <div className="absolute top-9 right-4 z-20">
              <button
                onClick={() => setShowLangMenu((s) => !s)}
                className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full"
                style={{ background: "rgba(34,31,38,0.85)", backdropFilter: "blur(6px)", border: `1px solid ${C.border}` }}
              >
                <Globe size={12} color={C.accent} />
                <span className="text-[10px]" style={{ color: C.textDim }}>{lang.toUpperCase()}</span>
              </button>
              {showLangMenu && (
                <div
                  className="absolute right-0 mt-1.5 rounded-xl overflow-hidden"
                  style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: "0 8px 24px rgba(0,0,0,0.5)" }}
                >
                  {LANGUAGES.map((l) => (
                    <button
                      key={l.code}
                      onClick={() => {
                        setLang(l.code);
                        setShowLangMenu(false);
                      }}
                      className="block w-full text-left px-4 py-2.5 text-xs whitespace-nowrap"
                      style={{
                        background: lang === l.code ? C.accentSoft : "transparent",
                        color: lang === l.code ? C.accent : C.textDim,
                      }}
                    >
                      {l.native}
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          <div className="flex-1 relative overflow-hidden">{content}</div>

          {!selectedListing && (
            <>
              <TabBar active={tab} onChange={setTab} />
              <button
                onClick={() => setShowChat(true)}
                className="absolute bottom-24 right-5 w-12 h-12 rounded-full flex items-center justify-center z-10"
                style={{ background: C.accent, boxShadow: "0 8px 20px rgba(0,0,0,0.4)" }}
              >
                <MessageCircle size={20} color={C.bg} />
              </button>
            </>
          )}

          {showChat && (
            <div className="absolute inset-0 z-30 flex flex-col" style={{ background: C.bg }}>
              <div className="flex justify-end px-4 pt-3">
                <button
                  onClick={() => setShowChat(false)}
                  className="w-8 h-8 rounded-full flex items-center justify-center"
                  style={{ background: C.surface }}
                >
                  <X size={14} color={C.textDim} />
                </button>
              </div>
              <div className="flex-1 overflow-hidden">
                <ChatScreen />
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ApartmentShowcaseDemo() {
  return (
    <LangProvider>
      <AppShell />
    </LangProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ApartmentShowcaseDemo />);
</script>
</body>
</html>
